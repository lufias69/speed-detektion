name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows executable
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name SpeedMonitor ^
            --add-data "config.json;." ^
            --add-data "requirements.txt;." ^
            desktop.py

      - name: Stage Windows release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path releases\SpeedMonitor-Windows-x64 | Out-Null
          Copy-Item dist\SpeedMonitor.exe releases\SpeedMonitor-Windows-x64\SpeedMonitor.exe
          Copy-Item config.json releases\SpeedMonitor-Windows-x64\config.json
          Copy-Item README.md releases\SpeedMonitor-Windows-x64\README.md
          Copy-Item INSTALL.md releases\SpeedMonitor-Windows-x64\INSTALL.md
          Compress-Archive -Path releases\SpeedMonitor-Windows-x64\* -DestinationPath releases\SpeedMonitor-Windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedMonitor-Windows-x64
          path: releases/SpeedMonitor-Windows-x64.zip

  build-linux:
    name: Build Linux x64 executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-venv libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Create venv and install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller

      - name: Build Linux executable
        run: |
          .venv/bin/python -m PyInstaller --noconfirm --onefile --name SpeedMonitor \
            --add-data "config.json:." \
            --add-data "requirements.txt:." \
            desktop.py

      - name: Stage Linux release
        run: |
          mkdir -p releases/SpeedMonitor-Linux-x64
          cp dist/SpeedMonitor releases/SpeedMonitor-Linux-x64/SpeedMonitor
          cp config.json releases/SpeedMonitor-Linux-x64/config.json
          cp README.md releases/SpeedMonitor-Linux-x64/README.md
          cp INSTALL.md releases/SpeedMonitor-Linux-x64/INSTALL.md
          tar -czf releases/SpeedMonitor-Linux-x64.tar.gz -C releases SpeedMonitor-Linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedMonitor-Linux-x64
          path: releases/SpeedMonitor-Linux-x64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SpeedMonitor-Windows-x64
          path: ./artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: SpeedMonitor-Linux-x64
          path: ./artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
